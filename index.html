<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: full-bleed isometric board, floating HUD top, info card bottom-left, round End Turn bottom-right. Single dusk-sea look. */
:root{
  --sea:#0d2236; --sea2:#123552;
  --panel:#16263b; --panel2:#1f3552; --line:rgba(226,236,255,.13);
  --text:#f5efe2; --muted:#9fb0c6;
  --gold:#ffc94d; --coral:#ff6a5c; --mint:#68e0b2; --sky:#8ecdf5;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea);color:var(--text);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.55rem .9rem;font-weight:600;transition:transform .12s,background .15s}
.btn:hover:not(:disabled){background:#284468}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}
.btn.gold:hover:not(:disabled){background:#ffd776}
.btn.ghost{background:transparent}
.star{color:var(--gold)}
.num{font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
.chip{background:rgba(18,32,50,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:.38rem .8rem;display:flex;align-items:center;gap:.45rem;font-weight:600;white-space:nowrap}
.chip .big{font-family:var(--display);font-size:1.25rem;line-height:1;font-weight:800}
.chip .sub{color:var(--muted);font-size:.8rem}
.fdot{width:12px;height:12px;border-radius:4px;transform:rotate(45deg);flex:none}
#hud .spacer{flex:1}

/* panel */
#panel{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(560px,calc(100% - 132px));max-height:46vh;overflow:auto;background:rgba(18,32,50,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#panel:empty{display:none}
.ph{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem}
.ph h3{margin:0;font-family:var(--display);font-size:1.35rem;line-height:1.1;font-weight:800}
.ph .owner{font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.86rem;color:var(--muted);margin:.25rem 0 .45rem}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted);line-height:1.45;margin:.2rem 0 .5rem;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:.45rem}
.sec{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:.7rem 0 .35rem;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:.45rem}
.ucard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.45rem .55rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.ucard:hover:not(:disabled){background:#284468}
.ucard:disabled{opacity:.4;cursor:not-allowed}
.ucard .n{font-weight:700;font-size:.9rem}
.ucard .c{font-size:.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.ucard .d{font-size:.72rem;color:var(--muted);line-height:1.3}
.pips{display:flex;gap:4px;margin:.2rem 0}
.pip{width:14px;height:8px;border-radius:3px;background:rgba(255,255,255,.14)}
.pip.on{background:var(--mint)}

/* end turn */
#endTurn{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:96px;height:96px;border-radius:50%;background:var(--gold);color:#2a1d00;font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1;box-shadow:0 10px 0 #b07f12,0 18px 30px rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s}
#endTurn:active{transform:translateY(6px);box-shadow:0 4px 0 #b07f12,0 8px 20px rgba(0,0,0,.4)}
#endTurn:disabled{background:#5a6576;color:#c9d1dc;box-shadow:0 10px 0 #3a4250;cursor:wait}
#endTurn small{display:block;font-family:var(--body);font-weight:600;font-size:.7rem;margin-top:3px;opacity:.75}

#toasts{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{background:rgba(18,32,50,.95);border:1px solid var(--line);border-radius:12px;padding:.45rem .85rem;font-size:.88rem;font-weight:600;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* modal */
.modal{position:absolute;inset:0;background:rgba(5,12,22,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;max-width:min(1100px,100%);max-height:90%;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5);min-width:0}
.mbox h2{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0 0 .2rem;line-height:1.1;text-wrap:balance}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.6rem}
.techgrid{display:grid;grid-template-columns:repeat(8,minmax(128px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.tcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.tcat{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 2px}
.tnode{border-radius:12px;padding:.5rem .55rem;text-align:left;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:.15rem}
.tnode .n{font-weight:700;font-size:.9rem}
.tnode .d{font-size:.74rem;color:var(--muted);line-height:1.32}
.tnode .c{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.tnode.own{background:rgba(104,224,178,.14);border-color:rgba(104,224,178,.5)}
.tnode.own .c{color:var(--mint)}
.tnode.lock{opacity:.45}
.tnode.avail:hover{background:#284468}
.tnode.t2{margin-left:8px}.tnode.t3{margin-left:16px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:.6rem}
.choice button{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:1rem;text-align:left}
.choice button:hover{background:#284468;border-color:var(--gold)}
.choice b{font-family:var(--display);font-size:1.25rem;display:block}
.choice span{color:var(--muted);font-size:.88rem}
table.sc{width:100%;border-collapse:collapse;font-size:.92rem;margin:.6rem 0}
table.sc td,table.sc th{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left}
table.sc td.r,table.sc th.r{text-align:right;font-variant-numeric:tabular-nums}

/* menu */
#menu{position:absolute;inset:0;overflow:auto;z-index:30;background:linear-gradient(180deg,rgba(9,22,36,.35),rgba(9,22,36,.9) 70%)}
@media (min-width:901px){#menu{background:linear-gradient(90deg,rgba(9,22,36,.92) 0,rgba(9,22,36,.7) 38%,rgba(9,22,36,.1) 70%)}}
.mwrap{max-width:1040px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,6.2rem);line-height:.86;margin:0;letter-spacing:-.01em;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.logo span{color:var(--gold)}
.tag{color:var(--muted);font-size:1.05rem;margin:.4rem 0 0;max-width:46ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{background:rgba(22,38,59,.92);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:.3rem;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--gold)}
.mode b{font-family:var(--display);font-size:1.4rem;line-height:1.05}
.mode span{color:var(--muted);font-size:.88rem;line-height:1.4}
.card{background:rgba(22,38,59,.94);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h2{font-family:var(--display);font-size:1.6rem;margin:0 0 .6rem}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fac{background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:10px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-width:0}
.fac.on{border-color:var(--gold)}
.fac canvas{width:64px;height:64px;flex:none}
.fac .fn{font-family:var(--display);font-size:1.2rem;font-weight:800;line-height:1}
.fac .fe{font-size:.75rem;color:var(--muted);margin-top:2px}
.fac .fb{font-size:.78rem;margin-top:5px;line-height:1.35}
.fac .ft{font-size:.72rem;color:var(--muted);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;font:inherit}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.seat .sn{font-weight:700;min-width:5.5rem}
.code{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:.12em;color:var(--gold)}
.note{color:var(--muted);font-size:.86rem;line-height:1.45;max-width:70ch}
.err{color:var(--coral);font-weight:600}

#pass{position:absolute;inset:0;z-index:25;background:var(--sea);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:16px}
#pass h2{font-family:var(--display);font-size:2.4rem;margin:0}

@media (max-width:640px){
  #panel{width:auto;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);max-height:38vh}
  #endTurn{width:84px;height:84px}
  .chip{padding:.3rem .6rem}
  .chip .big{font-size:1.1rem}
  .hidesm{display:none}
  #toasts{top:calc(env(safe-area-inset-top,0px) + 112px)}
}
.menu-main{display:flex;flex-direction:column;gap:12px;max-width:360px}
.bigbtn{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;padding:.65rem 1.2rem;border-radius:18px;background:rgba(31,53,82,.92);border:1px solid var(--line);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:1rem;transition:transform .12s,background .15s}
.bigbtn:hover{transform:translateX(3px);background:#284468}
.bigbtn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}
.bigbtn.gold:hover{background:#ffd776}
.bigbtn small{font-family:var(--body);font-weight:600;font-size:.78rem;opacity:.72}
.iconrow{display:flex;gap:18px;flex-wrap:wrap}
.iconbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.iconbtn .ic{width:60px;height:60px;border-radius:50%;background:rgba(31,53,82,.92);border:1px solid var(--line);display:grid;place-items:center;transition:transform .12s,border-color .15s}
.iconbtn:hover .ic{transform:translateY(-2px);border-color:var(--gold)}
.iconbtn svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.realmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.realm{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .12s,border-color .15s}
.realm:hover{transform:translateY(-3px);border-color:var(--gold)}
.realm canvas{width:120px;height:85px}
.realm b{font-family:var(--display);font-size:1.2rem;line-height:1.1}
.realm span{font-size:.74rem;color:var(--muted)}
.rdetail{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:center}
.rdetail canvas{width:260px;max-width:100%;height:auto;aspect-ratio:240/170}
@media (max-width:640px){.rdetail{grid-template-columns:1fr;justify-items:center}}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:.7rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toggle{width:52px;height:30px;border-radius:999px;background:#3a4a60;position:relative;flex:none}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--mint)}
.toggle[aria-pressed="true"]::after{left:26px}
input[type=range]{accent-color:var(--gold);width:140px}
#tut{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);width:min(460px,calc(100% - 32px));background:rgba(18,32,50,.97);border:1.5px solid var(--gold);border-radius:16px;padding:12px 14px;z-index:15;box-shadow:0 14px 30px rgba(0,0,0,.4)}
#tut h4{margin:0 0 .2rem;font-family:var(--display);font-size:1.2rem;line-height:1.15}
#tut p{margin:0 0 .5rem;font-size:.9rem;line-height:1.45}
#tut .tf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#tut .tc{font-size:.75rem;color:var(--muted)}
#tut .btn{padding:.4rem .7rem;font-size:.85rem}
.tut-on #toasts{top:calc(env(safe-area-inset-top,0px) + 205px)}
@media (max-width:640px){#tut{top:calc(env(safe-area-inset-top,0px) + 108px)}.tut-on #toasts{top:calc(env(safe-area-inset-top,0px) + 260px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

/* ===================== UTILS ===================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(rng){const G=64,g=[];for(let i=0;i<G*G;i++)g.push(rng());const at=(x,y)=>g[((y%G+G)%G)*G+((x%G+G)%G)];const sm=t=>t*t*(3-2*t);
 return(x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0),a=at(x0,y0),b=at(x0+1,y0),c=at(x0,y0+1),d=at(x0+1,y0+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}}
const inb=(x,y)=>x>=0&&y>=0&&x<S.w&&y<S.h;
const T=(x,y)=>S.tiles[y*S.w+x];
const K=(x,y)=>y*S.w+x;
const cheb=(a,b,c,d)=>Math.max(Math.abs(a-c),Math.abs(b-d));
function nbrs(x,y,r=1){const o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(inb(nx,ny))o.push([nx,ny])}return o}
const unitAt=(x,y)=>S.units.find(u=>u.x===x&&u.y===y);
const getUnit=id=>S.units.find(u=>u.id===id);
const FAC=pi=>FACTIONS[S.players[pi].f];
const has=(pi,id)=>S.players[pi].techs.includes(id);
const isWater=t=>!!TERRAIN[t.t].water;
const terrOwner=t=>t.terr>=0?S.cities[t.terr].owner:-1;
const citiesOf=pi=>S.cities.filter(c=>c.owner===pi);
const unitsOf=pi=>S.units.filter(u=>u.owner===pi);
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===================== GENERATION ===================== */
function resFor(t,rng){const r=rng();switch(t){
 case 'grass':return r<.17?'fruit':r<.29?'crop':null;case 'forest':return r<.28?'game':null;case 'mountain':return r<.35?'ore':null;
 case 'shallow':return r<.32?'fish':null;case 'desert':return r<.16?'oasis':null;case 'snow':return r<.2?'pelts':null}return null}
function newGame(cfg){
 const seed=cfg.seed||((Math.random()*2**31)|0),rng=mulberry(seed),w=cfg.size,h=cfg.size;
 S={w,h,tiles:[],cities:[],units:[],players:[],turn:1,cur:0,mode:cfg.mode,limit:cfg.limit||30,diff:cfg.diff||'normal',nextId:1,over:false,winner:-1,pending:[],seed,online:!!cfg.online,hot:!!cfg.hot};
 const n1=makeNoise(rng),n2=makeNoise(rng),n3=makeNoise(rng),n4=makeNoise(rng);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const edge=Math.max(Math.abs(x/(w-1)-.5),Math.abs(y/(h-1)-.5))*2;
  let e=n1(x/4.3,y/4.3)*.7+n2(x/2.1,y/2.1)*.3;e=e-Math.pow(edge,3)*.5+.14;
  const m=n3(x/3.6,y/3.6),tp=n4(x/5,y/5);let t;
  if(e<.3)t='ocean';else if(e<.39)t='shallow';else if(e>.76)t='mountain';else if(tp<.24)t='snow';else if(m<.3)t='desert';else if(m>.6)t='forest';else t='grass';
  S.tiles.push({t,r:resFor(t,rng),imp:null,city:-1,terr:-1,ruin:false});
 }
 // starts
 const n=cfg.seats.length;let cands=[];
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const t=T(x,y).t;if(!['ocean','shallow','mountain'].includes(t))cands.push([x,y])}
 if(cands.length<n*3){cands=[];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)cands.push([x,y])}
 const chosen=[cands[Math.floor(rng()*cands.length)]];
 while(chosen.length<n){let best=null,bd=-1;for(const c of cands){const d=Math.min(...chosen.map(o=>cheb(c[0],c[1],o[0],o[1])))+rng()*.6;if(d>bd){bd=d;best=c}}chosen.push(best)}
 shuffle(chosen,rng);
 cfg.seats.forEach((seat,i)=>{
  const [x,y]=chosen[i],f=FACTIONS[seat.f];
  for(const [nx,ny] of nbrs(x,y,2)){const t=T(nx,ny),d=cheb(x,y,nx,ny);
   if(d===1&&(isWater(t)||t.t==='mountain')){t.t=f.terrain==='forest'?'forest':'grass';t.r=resFor(t.t,rng)}
   if(rng()<.42){
    if(f.terrain==='shallow'||f.terrain==='mountain'){if(d===2){t.t=f.terrain;t.r=resFor(t.t,rng)}}
    else if(!(d===2&&isWater(t)&&rng()<.5)){t.t=f.terrain;t.r=resFor(t.t,rng)}
   }}
  const ct=T(x,y);ct.t=['desert','snow'].includes(f.terrain)?f.terrain:'grass';ct.r=null;
  const ring=shuffle(nbrs(x,y,1),rng);let cnt=ring.filter(([a,b])=>T(a,b).r).length;
  for(const [a,b] of ring){if(cnt>=3)break;const t=T(a,b);if(t.r)continue;t.r={grass:'fruit',forest:'game',snow:'pelts',desert:'oasis',mountain:'ore',shallow:'fish',ocean:null}[t.t];if(t.r)cnt++}
  const p={f:seat.f,human:!!seat.human,uid:seat.uid||null,stars:5+(f.id==='ashkar'?3:0)+(seat.human?0:DIFF[S.diff].stars),techs:[f.tech],explored:new Array(w*h).fill(0),alive:true,kills:0};
  S.players.push(p);
 });
 cfg.seats.forEach((seat,i)=>{const [x,y]=chosen[i];const c=makeCity(x,y,i);c.capital=true;c.name=genName(i);claim(c);
  addUnit(FACTIONS[seat.f].id==='orrhan'?'rider':'warrior',i,x,y,false);reveal(i,x,y,2)});
 // villages
 const land=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=T(x,y);if(!isWater(t)&&t.t!=='mountain'&&t.city<0)land.push([x,y])}
 shuffle(land,rng);const target=Math.round(w*h/15);let placed=0;
 for(const [x,y] of land){if(placed>=target)break;if(S.cities.some(c=>cheb(c.x,c.y,x,y)<2))continue;
  const t=T(x,y);if(t.terr>=0&&cheb(x,y,S.cities[t.terr].x,S.cities[t.terr].y)<2)continue;makeCity(x,y,-1);placed++}
 shuffle(land,rng);const rt=Math.round(w*h/42);placed=0;
 for(const [x,y] of land){if(placed>=rt)break;const t=T(x,y);if(t.city>=0||t.terr>=0)continue;if(S.cities.some(c=>c.capital&&cheb(c.x,c.y,x,y)<3))continue;if(nbrs(x,y).some(([a,b])=>T(a,b).ruin||T(a,b).city>=0))continue;t.ruin=true;t.r=null;placed++}
 startTurn(0);
 return S;
}
function makeCity(x,y,owner){const c={id:S.cities.length,x,y,owner,name:owner>=0?genName(owner):'Free village',level:1,pop:0,capital:false,bld:{},extra:0,radius:1,park:0};S.cities.push(c);const t=T(x,y);t.city=c.id;t.r=null;t.imp=null;return c}
function claim(c){for(let dy=-c.radius;dy<=c.radius;dy++)for(let dx=-c.radius;dx<=c.radius;dx++){const x=c.x+dx,y=c.y+dy;if(!inb(x,y))continue;const t=T(x,y);if(t.terr<0||(t.terr>=0&&S.cities[t.terr].owner<0))t.terr=c.id}T(c.x,c.y).terr=c.id}
function genName(pi){const f=FAC(pi);for(let k=0;k<30;k++){const a=f.syl[Math.floor(Math.random()*f.syl.length)],b=f.suf[Math.floor(Math.random()*f.suf.length)];let n=a+b;n=n[0].toUpperCase()+n.slice(1).toLowerCase();if(n!==f.name&&!S.cities.some(c=>c.name===n))return n}return f.name+' '+(S.cities.length+1)}
function addUnit(type,owner,x,y,spent=true){const st=UNITS[type];const u={id:S.nextId++,type,owner,x,y,hp:st.hp,moved:spent,attacked:spent,kills:0,vet:false,boat:false};S.units.push(u);reveal(owner,x,y,vision(u));return u}

/* ===================== VISION ===================== */
function reveal(pi,x,y,r){const e=S.players[pi].explored;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(inb(nx,ny))e[K(nx,ny)]=1}}
function vision(u){let v=UNITS[u.type].vision||1;if(T(u.x,u.y).t==='mountain')v++;if(has(u.owner,'carto'))v++;return v}
function visibleSet(pi){const v=new Uint8Array(S.w*S.h);if(pi<0){v.fill(1);return v}
 const mark=(x,y,r)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(inb(nx,ny))v[K(nx,ny)]=1}};
 for(const u of S.units)if(u.owner===pi)mark(u.x,u.y,vision(u));
 for(const c of S.cities)if(c.owner===pi)mark(c.x,c.y,2+(has(pi,'carto')?1:0));
 return v}

/* ===================== ECONOMY ===================== */
function income(pi){const p=S.players[pi];let s=0;const comm=has(pi,'comm'),guild=has(pi,'guild'),sol=FAC(pi).id==='solenne';
 for(const c of S.cities){if(c.owner!==pi)continue;s+=c.level+(c.capital?1:0)+(c.bld.workshop?1:0)+(c.bld.market?2:0)+c.extra+(comm?1:0)+(guild?2:0)+(c.capital&&sol?1:0)}
 if(!p.human)s+=DIFF[S.diff].inc;return s}
function techCost(pi,id){const t=TECHMAP[id],n=Math.max(1,citiesOf(pi).length);let c=[0,3,6,9][t.tier]+t.tier*n;if(FAC(pi).id==='nyxar')c--;return Math.max(1,c)}
function techAvail(pi,id){return !has(pi,id)&&TECHMAP[id].req.every(r=>has(pi,r))}
function research(pi,id){if(!techAvail(pi,id))return false;const c=techCost(pi,id),p=S.players[pi];if(p.stars<c)return false;p.stars-=c;p.techs.push(id);
 if(id==='carto')for(const ct of citiesOf(pi))reveal(pi,ct.x,ct.y,4);
 HOOK.toast(pi,`${FAC(pi).name} researched ${TECHMAP[id].name}`);HOOK.changed();return true}
function unitCost(pi,type){return UNITS[type].cost-(type==='defender'&&FAC(pi).id==='frosthal'?1:0)}
function unitCap(pi){return citiesOf(pi).reduce((s,c)=>s+c.level+1,0)}
function coastTiles(c){return nbrs(c.x,c.y,2).filter(([x,y])=>{const t=T(x,y);return isWater(t)&&t.terr===c.id})}
function spawnTile(c,type){const pi=c.owner;
 if(UNITS[type].naval){if(!c.bld.port)return null;for(const [x,y] of coastTiles(c)){const t=T(x,y);if(isWater(t)&&(t.t==='shallow'||has(pi,'deep'))&&!unitAt(x,y))return[x,y]}return null}
 return unitAt(c.x,c.y)?null:[c.x,c.y]}
function trainCheck(pi,cid,type){const c=S.cities[cid],st=UNITS[type];if(c.owner!==pi)return 'Not your city';if(st.tech&&!has(pi,st.tech))return 'Needs '+TECHMAP[st.tech].name;
 if(st.naval&&!c.bld.port)return 'Needs a Port';if(unitsOf(pi).length>=unitCap(pi))return 'Unit limit reached';if(!spawnTile(c,type))return st.naval?'No free water':'City tile occupied';
 if(S.players[pi].stars<unitCost(pi,type))return 'Not enough stars';return null}
function train(pi,cid,type){if(trainCheck(pi,cid,type))return null;const c=S.cities[cid],[x,y]=spawnTile(c,type);S.players[pi].stars-=unitCost(pi,type);const u=addUnit(type,pi,x,y,true);HOOK.flash(x,y,FAC(pi).color);HOOK.changed();return u}
function coastal(c){return coastTiles(c).length>0}
function buildCheck(pi,cid,b){const c=S.cities[cid],B=BLD[b];if(c.owner!==pi)return 'Not your city';if(c.bld[b])return 'Built';if(!has(pi,B.tech))return 'Needs '+TECHMAP[B.tech].name;if(b==='port'&&!coastal(c))return 'No water in borders';if(S.players[pi].stars<B.cost)return 'Not enough stars';return null}
function build(pi,cid,b){if(buildCheck(pi,cid,b))return false;const c=S.cities[cid];S.players[pi].stars-=BLD[b].cost;c.bld[b]=true;HOOK.flash(c.x,c.y,'#ffc94d');if(b==='port'||b==='temple')addPop(c,1);HOOK.changed();return true}
function harvestInfo(pi,x,y){const t=T(x,y);if(t.terr<0||t.city>=0)return null;const c=S.cities[t.terr];if(c.owner!==pi)return null;
 if(t.r){const R=RES[t.r];return{label:R.act,cost:R.cost,pop:R.pop,tech:R.tech,ok:has(pi,R.tech),city:c}}
 if(t.t==='forest'&&!t.imp)return{label:'Lumber hut',cost:3,pop:1,tech:'wood',ok:has(pi,'wood'),city:c,lumber:true};return null}
function harvest(pi,x,y){const h=harvestInfo(pi,x,y);if(!h||!h.ok||S.players[pi].stars<h.cost)return false;const t=T(x,y);S.players[pi].stars-=h.cost;
 if(h.lumber)t.imp='lumber';else{const R=RES[t.r];if(R.imp)t.imp=R.imp;t.r=null}
 HOOK.float(x,y,'+'+h.pop+' pop','#68e0b2');addPop(h.city,h.pop);HOOK.changed();return true}
function addPop(c,n){c.pop+=n;while(c.pop>=c.level+1){c.pop-=c.level+1;c.level++;HOOK.float(c.x,c.y,'Level '+c.level+'!','#ffc94d');
  if(S.players[c.owner].human)S.pending.push({cid:c.id,level:c.level});else applyReward(c,aiReward(c))}}
function rewardOptions(level){
 if(level===2)return[{id:'workshop',t:'Workshop',d:'+1★ every turn from this city'},{id:'explorer',t:'Explorer',d:'Reveal everything within 4 tiles'}];
 if(level===3)return[{id:'stars5',t:'Treasury',d:'+5★ right now'},{id:'walls',t:'City walls',d:'Units here defend at ×3'}];
 if(level===4)return[{id:'borders',t:'Wider borders',d:'Territory grows to 2 tiles'},{id:'pop3',t:'Growth spurt',d:'+3 population'}];
 return[{id:'park',t:'Grand park',d:'+1★ per turn and +150 score'},{id:'champion',t:'Champion',d:'A free Blademaster appears here'}]}
function applyReward(c,id){const pi=c.owner,p=S.players[pi];
 switch(id){case 'workshop':if(c.bld.workshop)c.extra++;else c.bld.workshop=true;break;
 case 'explorer':reveal(pi,c.x,c.y,4);break;case 'stars5':p.stars+=5;break;
 case 'walls':if(c.bld.walls)p.stars+=3;else c.bld.walls=true;break;
 case 'borders':c.radius=2;claim(c);break;case 'pop3':addPop(c,3);break;
 case 'park':c.extra++;c.park++;break;
 case 'champion':{let spot=!unitAt(c.x,c.y)?[c.x,c.y]:nbrs(c.x,c.y).find(([x,y])=>!unitAt(x,y)&&!isWater(T(x,y))&&T(x,y).t!=='mountain');if(spot)addUnit('sword',pi,spot[0],spot[1],true);else p.stars+=5;break}}
 HOOK.changed()}

/* ===================== MOVEMENT & COMBAT ===================== */
function uStat(u){const st=UNITS[u.type],vel=FAC(u.owner).id==='vellmar',deep=has(u.owner,'deep');const maxhp=st.hp+(u.vet?5:0);
 if(u.boat)return{atk:1,def:1,mv:2+(deep?1:0)+(vel?1:0),rng:1,maxhp};
 return{atk:st.atk,def:st.def,mv:st.mv+(st.naval?(vel?1:0)+(deep?1:0):0),rng:st.rng,maxhp}}
function moveInfo(u,nx,ny){const st=UNITS[u.type],t=T(nx,ny),pi=u.owner,water=isWater(t);
 if(st.naval){if(!water)return null;if(t.t==='ocean'&&!has(pi,'deep'))return null;return{stop:false}}
 if(u.boat){if(water){if(t.t==='ocean'&&!has(pi,'deep'))return null;return{stop:false}}if(t.t==='mountain'&&!has(pi,'mine'))return null;return{stop:true}}
 if(water){if(t.t!=='shallow'||!has(pi,'nav'))return null;return{stop:true}}
 if(t.t==='mountain'&&!has(pi,'mine'))return null;
 let stop=false;if(t.t==='forest'&&!st.path&&FAC(pi).id!=='sylvaine')stop=true;if(t.t==='mountain'&&!st.path)stop=true;return{stop}}
const canMove=u=>!u.moved&&(!u.attacked||UNITS[u.type].skirm);
const canAttack=u=>!u.attacked&&!(UNITS[u.type].noMoveAtk&&u.moved);
function adjEnemy(x,y,pi){return S.units.some(e=>e.owner!==pi&&cheb(e.x,e.y,x,y)===1)}
function reachable(u){const res=new Map();if(!canMove(u))return res;const st=uStat(u),best=new Map([[K(u.x,u.y),st.mv]]),q=[[u.x,u.y,st.mv]];

 return res}
function targetsOf(u,vis){if(!canAttack(u))return[];const r=uStat(u).rng;vis=vis||visibleSet(u.owner);
 return S.units.filter(e=>e.owner!==u.owner&&cheb(e.x,e.y,u.x,u.y)<=r&&vis[K(e.x,e.y)])}

 if(t.city>=0&&S.cities[t.city].owner===d.owner){b=S.cities[t.city].bld.walls?3:1.5;if(d.type==='defender')b*=1.5}
 else if(TERRAIN[t.t].def&&!d.boat){b=1.5;if(t.t==='mountain'&&FAC(d.owner).id==='korrund')b=2}return b}

 let dmg=Math.round(aF/tot*A.atk*4.5);if(a.type==='siege'&&T(d.x,d.y).city>=0)dmg=Math.round(dmg*1.5);dmg=Math.max(1,dmg);
 const ret=Math.round(dF/tot*D.def*4.5);return{dmg,ret,bonus:defBonus(d)}}
function promote(u){if(!u.vet&&u.kills>=3){u.vet=true;u.hp+=5;HOOK.float(u.x,u.y,'Veteran!','#ffc94d')}}

function doMove(u,x,y){u.x=x;u.y=y;u.moved=true;const t=T(x,y);if(!UNITS[u.type].naval)u.boat=isWater(t);reveal(u.owner,x,y,vision(u));
 HOOK.moved(u);if(t.ruin&&!isWater(t)){t.ruin=false;ruin(u)}HOOK.changed()}
function ruin(u){const pi=u.owner,p=S.players[pi],r=Math.random();let msg;
 if(r<.3){p.stars+=8;msg='found a hoard of 8 stars'}
 else if(r<.52){const opts=TECH.filter(t=>t.tier===1&&!has(pi,t.id));if(opts.length){const t=opts[Math.floor(Math.random()*opts.length)];p.techs.push(t.id);msg='recovered the secret of '+t.name}else{p.stars+=8;msg='found 8 stars'}}
 else if(r<.72){reveal(pi,u.x,u.y,4);msg='mapped the lands around the ruins'}
 else if(r<.88){const spot=nbrs(u.x,u.y).find(([x,y])=>!unitAt(x,y)&&!isWater(T(x,y))&&T(x,y).t!=='mountain');if(spot){addUnit('sword',pi,spot[0],spot[1],true);msg='met a wandering Blademaster who joined them'}else{p.stars+=6;msg='found 6 stars'}}
 else{const cs=citiesOf(pi);if(cs.length){const c=cs.reduce((a,b)=>cheb(a.x,a.y,u.x,u.y)<=cheb(b.x,b.y,u.x,u.y)?a:b);addPop(c,2);msg='brought settlers home to '+c.name}else{p.stars+=6;msg='found 6 stars'}}
 HOOK.float(u.x,u.y,'Ruins!','#ffc94d');HOOK.toast(pi,`${FAC(pi).name} explored ruins and ${msg}.`)}
function doAttack(a,d){const r=calc(a,d),dist=cheb(a.x,a.y,d.x,d.y);HOOK.lunge(a,d);d.hp-=r.dmg;HOOK.float(d.x,d.y,'−'+r.dmg,'#ff6a5c');
 if(a.type==='colossus')for(const e of S.units.slice())if(e!==d&&e.owner!==a.owner&&cheb(e.x,e.y,a.x,a.y)===1){e.hp-=3;HOOK.float(e.x,e.y,'−3','#ff6a5c');if(e.hp<=0){killUnit(e);a.kills++;S.players[a.owner].kills++}}
 a.attacked=true;if(!UNITS[a.type].skirm)a.moved=true;
 if(d.hp<=0){killUnit(d);a.kills++;S.players[a.owner].kills++;promote(a);
  if(uStat(a).rng===1&&dist===1&&!UNITS[a.type].naval&&!unitAt(d.x,d.y)&&moveInfo(a,d.x,d.y)){a.x=d.x;a.y=d.y;a.boat=isWater(T(a.x,a.y));reveal(a.owner,a.x,a.y,vision(a))}}

 HOOK.changed()}
function canCapture(u){const t=T(u.x,u.y);return t.city>=0&&S.cities[t.city].owner!==u.owner&&!u.moved&&!u.attacked&&!UNITS[u.type].nocap&&!UNITS[u.type].naval&&!u.boat}
function capture(u){if(!canCapture(u))return false;const c=S.cities[T(u.x,u.y).city],prev=c.owner;c.owner=u.owner;u.moved=u.attacked=true;
 if(prev<0){c.name=genName(u.owner);claim(c);HOOK.toast(u.owner,`${FAC(u.owner).name} founded ${c.name}`)}else{const wasCap=c.capital;c.capital=false;HOOK.toast([u.owner,prev],`${FAC(u.owner).name} captured ${c.name}${wasCap?', a capital':''}!`)}
 reveal(u.owner,c.x,c.y,2);HOOK.flash(c.x,c.y,FAC(u.owner).color);if(prev>=0)checkElim(prev);checkVictory();HOOK.changed();return true}
function rest(u){if(u.moved||u.attacked)return false;const max=uStat(u).maxhp;let h=terrOwner(T(u.x,u.y))===u.owner?4:2;if(u.type==='colossus')h+=2;const g=Math.min(max-u.hp,h);u.hp+=g;u.moved=u.attacked=true;HOOK.float(u.x,u.y,'+'+g,'#68e0b2');HOOK.changed();return true}
function checkElim(pi){const p=S.players[pi];if(p.alive&&!citiesOf(pi).length){p.alive=false;S.units=S.units.filter(u=>u.owner!==pi);HOOK.toast(-1,`${FAC(pi).name} has fallen.`)}}
function score(pi){const p=S.players[pi];let s=0;for(const c of S.cities)if(c.owner===pi)s+=100+c.level*50+(c.bld.temple?100:0)+c.park*150;
 s+=p.techs.length*40;let ex=0;for(const e of p.explored)ex+=e;s+=ex*2+p.kills*15;return s}
function checkVictory(){if(S.over)return;const alive=S.players.map((p,i)=>i).filter(i=>S.players[i].alive);
 if(alive.length<=1){S.over=true;S.winner=alive[0]??-1;return}
 const humans=S.players.filter(p=>p.human);if(humans.length&&!humans.some(p=>p.alive)&&!S.online){S.over=true;S.winner=alive.sort((a,b)=>score(b)-score(a))[0]}}
function startTurn(pi){const p=S.players[pi];p.stars+=income(pi);for(const u of S.units)if(u.owner===pi){u.moved=false;u.attacked=false}}
function advance(){const n=S.players.length;let i=S.cur;for(let k=0;k<n;k++){i=(i+1)%n;if(i===0)S.turn++;if(S.players[i].alive)break}
 S.cur=i;if(S.mode==='score'&&S.turn>S.limit){S.over=true;S.winner=S.players.map((p,j)=>j).filter(j=>S.players[j].alive).sort((a,b)=>score(b)-score(a))[0];return}
 startTurn(i)}

/* ===================== AI ===================== */
function threatAt(x,y,pi,r=2){return S.units.filter(e=>e.owner!==pi&&cheb(e.x,e.y,x,y)<=r).length}
function aiReward(c){const pi=c.owner,thr=threatAt(c.x,c.y,pi,3);
 if(c.level===2)return'workshop';if(c.level===3)return thr?'walls':'stars5';if(c.level===4)return'borders';return thr||Math.random()<.5?'champion':'park'}
function aiGoals(pi){const p=S.players[pi],g=[];
 for(const c of S.cities){if(c.owner===pi||!p.explored[K(c.x,c.y)])continue;g.push({x:c.x,y:c.y,w:c.owner<0?0:-1,city:true,claims:0})}
 const vis=visibleSet(pi);for(const u of S.units)if(u.owner!==pi&&vis[K(u.x,u.y)])g.push({x:u.x,y:u.y,w:2,unit:true,claims:0});return g}
function atWar(pi){const vis=visibleSet(pi);return S.units.some(u=>u.owner!==pi&&vis[K(u.x,u.y)])||S.cities.some(c=>c.owner>=0&&c.owner!==pi&&S.players[pi].explored[K(c.x,c.y)])}
function aiTechValue(pi,id){let terrCount={};for(let i=0;i<S.tiles.length;i++){const t=S.tiles[i];if(t.terr>=0&&S.cities[t.terr].owner===pi){const k=t.r||(t.t==='forest'&&!t.imp?'forestfree':null);if(k)terrCount[k]=(terrCount[k]||0)+1}}
 const c=k=>terrCount[k]||0,war=atWar(pi)?1:0,turn=S.turn;
 switch(id){case'agri':return 2+c('fruit')*3+c('oasis')*3;case'farm':return 1+c('crop')*4;case'hunt':return 2+c('game')*3+c('pelts')*3;case'mine':return 2+c('ore')*4;
 case'nav':return 1+c('fish')*3+(aiLandlocked(pi)?8:0);case'deep':return aiLandlocked(pi)?4:1;case'wood':return c('forestfree')*1.2;
 case'arch':return 4+war*3;case'mil':return 3+war*4;case'smith':return 5+war*4;case'siege':return 2+war*3;case'titan':return turn>14?8:2;
 case'trade':return 4;case'comm':return 2+citiesOf(pi).length;case'guild':return 3+citiesOf(pi).length;case'eng':return 4;case'fort':return 2+war*3;case'mason':return turn>12?4:1;
 case'explo':return turn<8?5:2;case'ride':return 5+war;case'carto':return 2}return 1}
function aiLandlocked(pi){const g=aiGoals(pi).filter(x=>x.city);if(!g.length)return false;const u=unitsOf(pi).find(u=>!UNITS[u.type].naval);if(!u)return false;
 // BFS over land from unit to see if any goal reachable
 const seen=new Uint8Array(S.w*S.h),q=[[u.x,u.y]];seen[K(u.x,u.y)]=1;while(q.length){const[x,y]=q.pop();if(g.some(o=>o.x===x&&o.y===y))return false;for(const[nx,ny]of nbrs(x,y)){const k=K(nx,ny),t=T(nx,ny);if(seen[k]||isWater(t))continue;seen[k]=1;q.push([nx,ny])}}return true}
function aiPickUnitType(pi,c,threat){const ok=t=>!trainCheck(pi,c.id,t);const p=S.players[pi];
 if(threat&&ok('defender')&&Math.random()<.6)return'defender';
 if(ok('colossus')&&Math.random()<.35)return'colossus';
 const ex=p.explored.reduce((a,b)=>a+b,0)/(S.w*S.h);if(ex<.45&&ok('scout')&&!unitsOf(pi).some(u=>u.type==='scout')&&S.turn<15)return'scout';
 if(c.bld.port&&ok('ship')&&aiLandlocked(pi)&&Math.random()<.5)return'ship';
 const pool=['sword','siege','rider','archer','warrior','defender'].filter(ok);if(!pool.length)return null;
 const w={sword:6,siege:atWar(pi)?3:0.5,rider:4,archer:4,warrior:2,defender:threat?3:.6};
 let tot=pool.reduce((s,t)=>s+w[t],0),r=Math.random()*tot;for(const t of pool){r-=w[t];if(r<=0)return t}return pool[0]}
function aiSpend(pi){const p=S.players[pi];
 for(let guard=0;guard<60;guard++){let best=null,bs=Math.max(.15,3.2-p.stars/8);
  // harvests
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const h=harvestInfo(pi,x,y);if(!h||!h.ok||h.cost>p.stars)continue;let s=10*h.pop/h.cost+(h.city.pop+h.pop>=h.city.level+1?3:0);if(s>bs){bs=s;best=()=>harvest(pi,x,y)}}
  // research
  for(const t of TECH){if(!techAvail(pi,t.id))continue;const cost=techCost(pi,t.id);if(cost>p.stars)continue;const s=aiTechValue(pi,t.id)*8/(cost+4);if(s>bs){bs=s;best=()=>research(pi,t.id)}}
  // buildings
  for(const c of citiesOf(pi))for(const b in BLD){if(buildCheck(pi,c.id,b))continue;const thr=threatAt(c.x,c.y,pi,2);
   let s={workshop:5,market:6,port:aiLandlocked(pi)?6:2.5,walls:thr?9:0.5,temple:S.turn>15?4:1}[b];if(s>bs){bs=s;best=()=>build(pi,c.id,b)}}
  // units
  const n=unitsOf(pi).length,cap=unitCap(pi);if(n<cap){const cs=citiesOf(pi);let war=atWar(pi);
   for(const c of cs){const thr=threatAt(c.x,c.y,pi,3);const type=aiPickUnitType(pi,c,thr);if(!type)continue;
    let s=(n<cs.length+1?7:4)+thr*3+(war?2:0)-(n/cap)*2;if(UNITS[type].cost>=8)s+=1;if(s>bs){bs=s;best=()=>train(pi,c.id,type)}}}
  if(!best)break;if(!best())break}}
function aiMoveScore(u,x,y,goals,stay){const pi=u.owner,t=T(x,y),st=UNITS[u.type];let v=0;
 let bestG=1e9;for(const g of goals){const d=cheb(x,y,g.x,g.y)-g.w+g.claims*1.5;if(g.city&&st.nocap)continue;if(d<bestG)bestG=d}
 if(bestG<1e9)v-=bestG*3;

 if(stay&&t.city>=0&&S.cities[t.city].owner===pi&&threatAt(x,y,pi,3)&&S.units.filter(o=>o.owner===pi&&o!==u&&cheb(o.x,o.y,x,y)===0).length===0)v+=30;

function aiBestAttack(u){const vis=visibleSet(u.owner);let best=null,bs=0;for(const d of targetsOf(u,vis)){const r=calc(u,d),kill=r.dmg>=d.hp,D=uStat(d),dist=cheb(u.x,u.y,d.x,d.y);
 const ret=kill?0:(D.def>0&&dist<=D.rng?r.ret:0);let s=r.dmg+(kill?6+UNITS[d.type].cost:0)-ret*(ret>=u.hp?4:1.1);if(T(d.x,d.y).city>=0)s+=2;if(s>bs){bs=s;best=d}}return best}
async function aiUnit(u,goals){const pause=()=>HOOK.pause(u);
 if(canCapture(u)){capture(u);await pause();return}
 let d=aiBestAttack(u);if(d){doAttack(u,d);await pause();if(!S.units.includes(u)||S.over)return;if(!UNITS[u.type].skirm)return}

  for(const[,[x,y]]of reach){const s=aiMoveScore(u,x,y,goals,false)+Math.random()*.4;if(s>bs){bs=s;best=[x,y]}}
  if(best){doMove(u,best[0],best[1]);let near=null,nd=1e9;for(const g of goals){const dd=cheb(best[0],best[1],g.x,g.y);if(dd<nd){nd=dd;near=g}}if(near)near.claims++;await pause()}}
 if(!S.units.includes(u))return;d=aiBestAttack(u);if(d){doAttack(u,d);await pause();return}
 if(!u.moved&&!u.attacked&&u.hp<uStat(u).maxhp)rest(u)}
async function runAI(pi){aiSpend(pi);const goals=aiGoals(pi);
 const us=unitsOf(pi).sort((a,b)=>(b.type==='scout')-(a.type==='scout'));for(const u of us){if(!S.units.includes(u))continue;await aiUnit(u,goals);if(S.over)return}
 aiSpend(pi)}

/* ===================== SAVE ===================== */
function serialize(){return JSON.stringify(S,(k,v)=>k==='explored'?v.join(''):v)}
function deserialize(str){const o=JSON.parse(str);for(const p of o.players)p.explored=p.explored.split('').map(Number);return o}
if(typeof module!=='undefined')module.exports={newGame,runAI,advance,score,get S(){return S},set S(v){S=v},HOOK,serialize,deserialize,FACTIONS};
</script>

/* ---------- canvas & camera ---------- */

function drawTileBase(x,y,t,X,Y,state,now){
 if(state===0){poly(diamond(X,Y,HW,HH),'#172a40');const h=hash(x,y);if(h%3===0){ctx.fillStyle='rgba(200,220,255,.04)';ctx.beginPath();ctx.ellipse(X+(h%16-8),Y+(h>>5)%6-3,14,6,0,0,7);ctx.fill()}return}
 const TT=TERRAIN[t.t],h=hash(x,y),v=((h&255)/255-.5)*.07;

  const ph=now/900+(x*.7+y*.4);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.2;ctx.beginPath();const ox=Math.sin(ph)*4;ctx.moveTo(X-12+ox,ty-2);ctx.quadraticCurveTo(X-6+ox,ty-5,X+ox,ty-2);ctx.stroke();

function auInit(){if(AU.ctx)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
 try{const c=new C();AU.ctx=c;AU.master=c.createGain();AU.master.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=SET.musicVol*.6;AU.sfx=c.createGain();AU.sfx.gain.value=SET.sfxVol;
  AU.lp=c.createBiquadFilter();AU.lp.type='lowpass';AU.lp.frequency.value=1700;AU.lp.connect(AU.mus);
  AU.delay=c.createDelay(1);AU.delay.delayTime.value=.42;AU.fb=c.createGain();AU.fb.gain.value=.33;AU.wet=c.createGain();AU.wet.gain.value=.3;
  AU.delay.connect(AU.fb);AU.fb.connect(AU.delay);AU.delay.connect(AU.wet);AU.wet.connect(AU.mus);
  AU.mus.connect(AU.master);AU.sfx.connect(AU.master);
  const len=c.sampleRate*.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;return true}catch(e){AU.ctx=null;return false}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(dest,freq,t,dur,vol,type='sine',att=.01){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
// generated soundtrack: four slow chords, a soft bass and a wandering pentatonic melody
const CHORDS=[[53,57,60,64],[48,55,59,64],[45,52,55,60],[43,50,55,59]],MEL=[60,62,64,67,69,72,74,76,79,81];
let musT=0,musStep=0,musTimer=null;
function musicStart(){if(!SET.music||!auInit())return;if(AU.ctx.state==='suspended')AU.ctx.resume();if(musTimer)return;musT=AU.ctx.currentTime+.15;musStep=0;musTimer=setInterval(musTick,200)}
function musicStop(){if(musTimer){clearInterval(musTimer);musTimer=null}}
function musTick(){const c=AU.ctx,e=60/74/2;
 while(musT<c.currentTime+.8){const s=musStep%64,ch=CHORDS[Math.floor(s/16)];
  if(s%16===0)for(const m of ch){note(AU.lp,mtof(m),musT,e*17,.045,'triangle',1.3);note(AU.lp,mtof(m)*1.004,musT,e*17,.03,'sine',1.6)}
  if(s%8===0)note(AU.lp,mtof(ch[0]-12),musT,e*7.5,.1,'sine',.04);
  if(Math.random()<(s%2===0?.42:.14)){AU.mi=Math.max(0,Math.min(MEL.length-1,AU.mi+Math.floor(Math.random()*5)-2));const f=mtof(MEL[AU.mi]);note(AU.lp,f,musT,1.1,.06,'sine',.01);note(AU.delay,f,musT,.8,.035,'triangle',.01)}
  musT+=e;musStep++}}
function sfx(k){if(!SET.sfx||demo||!auInit())return;const c=AU.ctx;if(c.state==='suspended')c.resume();const t=c.currentTime+.01,d=AU.sfx;
 switch(k){
 case'click':note(d,900,t,.05,.05,'triangle');break;
 case'move':note(d,520,t,.12,.1,'triangle');note(d,780,t+.05,.14,.08,'triangle');break;
 case'attack':{const n=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;n.buffer=AU.noise;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);n.connect(f);f.connect(g);g.connect(d);n.start(t);n.stop(t+.25);
  const o=note(d,150,t,.3,.3,'sine');o.frequency.exponentialRampToValueAtTime(50,t+.3);break}
 case'capture':[60,64,67,72].forEach((m,i)=>note(d,mtof(m+12),t+i*.08,.4,.1,'triangle'));break;
 case'level':[67,71,74,79,83].forEach((m,i)=>note(d,mtof(m),t+i*.06,.7,.08,'sine'));break;
 case'build':note(d,330,t,.12,.12,'triangle');note(d,494,t+.09,.18,.1,'triangle');break;
 case'tech':{const o=note(d,420,t,.5,.1,'sine',.04);o.frequency.exponentialRampToValueAtTime(1250,t+.45);break}
 case'turn':note(d,mtof(76),t,.9,.08,'sine');note(d,mtof(83),t+.13,1,.07,'sine');break;
 case'die':{const o=note(d,320,t,.45,.12,'triangle');o.frequency.exponentialRampToValueAtTime(70,t+.45);break}}}

let TUT=null;
function tutTarget(kind){if(VIEW<0)return null;
 if(kind==='unit'){const u=unitsOf(VIEW)[0];return u?[u.x,u.y]:null}
 if(kind==='capital'){const c=citiesOf(VIEW).find(c=>c.capital)||citiesOf(VIEW)[0];return c?[c.x,c.y]:null}
 if(kind==='harvest'){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){const h=harvestInfo(VIEW,x,y);if(h&&h.ok)return[x,y]}return null}
 if(kind==='village'){const cap=citiesOf(VIEW)[0],ex=S.players[VIEW].explored;let best=null,bd=1e9;for(const c of S.cities){if(c.owner>=0||!ex[K(c.x,c.y)])continue;const d=cap?cheb(c.x,c.y,cap.x,cap.y):0;if(d<bd){bd=d;best=[c.x,c.y]}}return best}
 return null}

  poly([Lx,Ly,Bx,By,Bx,By+th,Lx,Ly+th],'#6b4a33');poly([Bx,By,Rx,Ly,Rx,Ly+th,Bx,By+th],'#87603f');

   const t={t:isC?(L.city||'grass'):tt,r:isC?null:(L.res[x+','+y]||null),imp:null,ruin:false};const X=ox+(x-y)*HW,Y=oy+(x+y)*HH;
   drawTileBase(x+fi*5,y+fi*3,t,X,Y,2,1000);drawDecor(x+fi*5,y+fi*3,t,X,Y,1000);

 <div class="set-row"><div><b>Music</b><div class="hint" style="margin:0">A calm soundtrack, generated live</div></div><div class="row"><input type="range" id="sMusV" min="0" max="1" step="0.05" value="${SET.musicVol}" aria-label="Music volume">${tg('sMus',SET.music,'Music')}</div></div>
 <div class="set-row"><div><b>Sound effects</b><div class="hint" style="margin:0">Moves, battles, captures</div></div><div class="row"><input type="range" id="sSfxV" min="0" max="1" step="0.05" value="${SET.sfxVol}" aria-label="Sound effects volume">${tg('sSfx',SET.sfx,'Sound effects')}</div></div>
 <div class="set-row"><div><b>AI speed</b><div class="hint" style="margin:0">How long you watch rival moves</div></div><select id="sAi" aria-label="AI speed">${['slow','normal','fast','instant'].map(v=>`<option value="${v}" ${SET.aiSpeed===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div>
 <div class="set-row" style="border:0"><div><b>Tutorial</b><div class="hint" style="margin:0">Show the guided tour in your next game</div></div>${tg('sTut',!SET.tutSeen,'Tutorial')}</div>`,'420px');
 const flip=b=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);return v};
 $('#sMus').onclick=e=>{SET.music=flip(e.currentTarget);saveSet();SET.music?musicStart():musicStop()};
 $('#sSfx').onclick=e=>{SET.sfx=flip(e.currentTarget);saveSet()};
 $('#sTut').onclick=e=>{SET.tutSeen=!flip(e.currentTarget);saveSet()};
 $('#sMusV').oninput=e=>{SET.musicVol=+e.target.value;if(AU.mus)AU.mus.gain.value=SET.musicVol*.6;saveSet()};
 $('#sSfxV').oninput=e=>{SET.sfxVol=+e.target.value;if(AU.sfx)AU.sfx.gain.value=SET.sfxVol;saveSet()};
 $('#sSfxV').onchange=()=>sfx('capture');
 $('#sAi').onchange=e=>{SET.aiSpeed=e.target.value;saveSet()}}
function defaultSeats(kind){const n=kind==='solo'?4:kind==='online'?2:3;const out=[];for(let i=0;i<n;i++)out.push({f:i*3%8,human:kind==='hot'?i<2:i===0,ai:kind==='online'?false:!(kind==='hot'?i<2:i===0)});return out}
function setup(kind,f){setupKind=kind;seatsCfg=defaultSeats(kind);setupTut=kind!=='online'&&!SET.tutSeen;
 if(f!=null){const o=seatsCfg.findIndex(s=>s.f===f);if(o>0)seatsCfg[o].f=seatsCfg[0].f;seatsCfg[0].f=f}renderSetup()}
function renderSetup(){const kind=setupKind,title={solo:'Solo vs AI',hot:'Hotseat',online:'New online room'}[kind],me=FACTIONS[seatsCfg[0].f];
 M.innerHTML=`<div class="row" style="justify-content:space-between"><h1 class="logo" style="font-size:clamp(2rem,6vw,2.8rem)">${title}</h1><button class="btn" id="back">Back</button></div>
 ${kind==='solo'?`<div class="card"><div class="row" style="flex-wrap:nowrap"><canvas id="meDio" style="width:120px;height:85px;flex:none"></canvas><div style="min-width:0"><div class="fn" style="font-family:var(--display);font-weight:800;font-size:1.5rem;color:${me.color}">${me.name}</div><div class="hint" style="margin:0">${me.bonus}</div><button class="btn" id="chg" style="margin-top:8px">Change realm</button></div></div></div>`:''}
 <div class="card"><h2>${kind==='solo'?'Opponents':'Players'}</h2><div class="seats" id="seats"></div><div class="row" style="margin-top:10px"><button class="btn" id="addSeat">Add ${kind==='solo'?'opponent':'player'}</button></div></div>
 <div class="card"><h2>World</h2><div class="row">
  <div class="field"><label for="optSize">Map size</label><select id="optSize"><option value="12">Small · 12×12</option><option value="16" selected>Medium · 16×16</option><option value="20">Large · 20×20</option></select></div>
  <div class="field"><label for="optMode">Victory</label><select id="optMode"><option value="dom">Domination</option><option value="score">Score · turn limit</option></select></div>
  <div class="field"><label for="optLimit">Turn limit</label><select id="optLimit"><option>20</option><option selected>30</option><option>45</option></select></div>
  <div class="field"><label for="optDiff">AI strength</label><select id="optDiff"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></div>
  ${kind!=='online'?`<div class="field"><label for="optTut">Tutorial</label><button class="toggle" id="optTut" aria-pressed="${setupTut}"></button></div>`:''}</div></div>
 <div class="row"><button class="btn gold" id="go" style="font-size:1.1rem;padding:.8rem 1.4rem">${kind==='online'?'Create room':'Start game'}</button><span class="err" id="serr"></span></div>`;
 $('#back').onclick=()=>kind==='online'?onlineMenu():kind==='hot'?multiMenu():realmPicker('pick');
 if(kind==='solo'){diorama($('#meDio'),seatsCfg[0].f,120);$('#chg').onclick=()=>realmPicker('pick')}
 if($('#optTut'))$('#optTut').onclick=e=>{setupTut=!setupTut;e.currentTarget.setAttribute('aria-pressed',setupTut)};
 const ss=$('#seats');seatsCfg.forEach((s,i)=>{if(kind==='solo'&&i===0)return;const r=document.createElement('div');r.className='seat';
  const label=kind==='solo'?'AI '+i:'Player '+(i+1);
  r.innerHTML=`<span class="sn">${label}</span><span class="fdot" style="background:${FACTIONS[s.f].color}"></span><select data-i="${i}" data-k="f" aria-label="Realm for ${label}">${FACTIONS.map((f,j)=>`<option value="${j}" ${j===s.f?'selected':''}>${f.name}</option>`).join('')}</select>
  ${kind!=='solo'?`<select data-i="${i}" data-k="ctl" aria-label="Controller for ${label}"><option value="h" ${!s.ai?'selected':''}>${kind==='online'?(i===0?'You':'Online player'):'Human'}</option><option value="ai" ${s.ai?'selected':''} ${kind==='online'&&i===0?'disabled':''}>AI</option></select>`:''}
  ${seatsCfg.length>2&&!(kind!=='hot'&&i===0)?`<button class="btn ghost" data-rm="${i}">Remove</button>`:''}`;ss.appendChild(r)});
 ss.onchange=e=>{const el=e.target,i=+el.dataset.i;if(el.dataset.k==='f'){const v=+el.value,o=seatsCfg.findIndex(s=>s.f===v);if(o>=0)seatsCfg[o].f=seatsCfg[i].f;seatsCfg[i].f=v}else{seatsCfg[i].ai=el.value==='ai';seatsCfg[i].human=!seatsCfg[i].ai}renderSetup()};
 ss.onclick=e=>{const b=e.target.closest('[data-rm]');if(b){seatsCfg.splice(+b.dataset.rm,1);renderSetup()}};
 const add=$('#addSeat');add.disabled=seatsCfg.length>=(kind==='online'?6:8);add.onclick=()=>{const used=new Set(seatsCfg.map(s=>s.f));let f=0;while(used.has(f))f++;seatsCfg.push({f,human:false,ai:kind!=='online'});renderSetup()};
 $('#go').onclick=()=>{const cfg={size:+$('#optSize').value,mode:$('#optMode').value,limit:+$('#optLimit').value,diff:$('#optDiff').value};
  if(cfg.size===12&&seatsCfg.length>5){$('#serr').textContent='Small maps fit up to 5 realms. Pick a bigger map.';return}
  if(kind==='online'){createRoom(cfg);return}
  if(kind==='hot'&&seatsCfg.filter(s=>!s.ai).length<1){$('#serr').textContent='At least one human player is needed.';return}
  const seats=seatsCfg.map(s=>({f:s.f,human:!s.ai}));seats.sort((a,b)=>b.human-a.human);startLocal({...cfg,seats,hot:kind==='hot'},setupTut)}}

/* ===================== ONLINE ===================== */
async function getOnline(){if(online)return online;if(!window.claude||!window.claude.use)return null;
 try{const db=await window.claude.use('db'),user=await window.claude.use('user');if(!db||!user)return null;const me=await user.id();if(!me)return null;online={db,user,me,unsub:null,code:null,rev:0,room:null};return online}catch(e){return null}}
async function onlineMenu(){M.innerHTML=`<div class="row" style="justify-content:space-between"><h1 class="logo" style="font-size:2.6rem">Online room</h1><button class="btn" id="back">Back</button></div><div class="card"><p class="note" id="ostat">Connecting…</p></div>`;$('#back').onclick=multiMenu;
 const o=await getOnline();if(mode!=='menu')return;
 if(!o){$('#ostat').innerHTML='Online play is not available in this view. Open this page while signed in to claude.ai (players need access to the page) and try again. Solo and hotseat work everywhere.';return}
 M.innerHTML=`<div class="row" style="justify-content:space-between"><h1 class="logo" style="font-size:2.6rem">Online room</h1><button class="btn" id="back">Back</button></div>
 <div class="modes"><div class="card"><h2>Host</h2><p class="note">Set up realms and the map, then share the room code. Empty seats can be filled by AI.</p><div class="row" style="margin-top:10px"><button class="btn gold" id="host">Create a room</button></div></div>
 <div class="card"><h2>Join</h2><p class="note">Enter the 5-letter code from your host.</p><div class="row" style="margin-top:10px"><input type="text" id="jcode" maxlength="5" placeholder="CODE" aria-label="Room code" style="text-transform:uppercase;width:8rem;font-weight:700;letter-spacing:.1em"><button class="btn gold" id="join">Join</button></div><p class="err" id="jerr"></p></div></div>
 <p class="note">Online games are turn-by-turn: each player moves on their own turn and the board updates for everyone. You can close the page and come back with the code.</p>`;
 $('#back').onclick=multiMenu;$('#host').onclick=()=>setup('online');$('#join').onclick=()=>joinRoom($('#jcode').value.trim().toUpperCase())}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
async function createRoom(cfg){const o=await getOnline();if(!o)return onlineMenu();const code=genCode();const seats=seatsCfg.map((s,i)=>({f:s.f,ai:!!s.ai,uid:i===0?o.me:null}));
 try{await o.db.doc('rooms/'+code).set({status:'lobby',host:o.me,seats,cfg,state:null,rev:0});subscribeRoom(code)}catch(e){$('#serr').textContent='Could not create the room ('+(e.code||'error')+').'}}
async function joinRoom(code){const o=await getOnline();if(!o)return;if(!/^[A-Z0-9]{5}$/.test(code)){$('#jerr').textContent='Codes are 5 letters or digits.';return}
 try{const s=await o.db.doc('rooms/'+code).get();if(!s.exists){$('#jerr').textContent='No room with that code.';return}subscribeRoom(code)}catch(e){$('#jerr').textContent='Could not reach the room ('+(e.code||'error')+').'}}
function subscribeRoom(code){const o=online;if(o.unsub)o.unsub();o.code=code;o.rev=0;
 o.unsub=o.db.doc('rooms/'+code).onSnapshot(snap=>{if(!snap.exists)return;const r=snap.data();o.room=r;
  if(r.status==='lobby'){if(mode==='menu')renderLobby(r)}
  else if(r.state&&r.rev>o.rev&&!busy){o.rev=r.rev;const fresh=!S||!S.online||mode!=='game';S=deserialize(r.state);S.online=true;
   const mine=S.players.findIndex(p=>p.uid===o.me);if(fresh){enterGame();VIEW=mine;focusPlayer(mine>=0?mine:0)}else VIEW=mine;
   if(VIEW<0)VIEW=-1;if(S.over){ui();gameOver();return}if(isMine(S.cur))toast('Your turn!');ui()}},
  e=>{toast('Lost connection to the room ('+e.code+').')})}
function renderLobby(r){const o=online,isHost=r.host===o.me,mineIdx=r.seats.findIndex(s=>s.uid===o.me);
 M.innerHTML=`<div class="row" style="justify-content:space-between"><h1 class="logo" style="font-size:2.6rem">Room lobby</h1><button class="btn" id="back">Leave</button></div>
 <div class="card"><p class="note">Share this code with your friends:</p><div class="code">${o.code}</div><p class="note">${r.cfg.size}×${r.cfg.size} map · ${r.cfg.mode==='score'?'Score, '+r.cfg.limit+' turns':'Domination'} · AI ${r.cfg.diff}</p></div>
 <div class="card"><h2>Seats</h2><div class="seats">${r.seats.map((s,i)=>{const f=FACTIONS[s.f];return`<div class="seat"><span class="fdot" style="background:${f.color}"></span><span class="sn">${f.name}</span><span class="hint" style="margin:0">${s.ai?'AI':s.uid===o.me?'You':s.uid?'Player joined':'Open seat'}</span>${!s.ai&&!s.uid&&mineIdx<0?`<button class="btn gold" data-seat="${i}">Take seat</button>`:''}</div>`}).join('')}</div></div>
 <div class="row">${isHost?`<button class="btn gold" id="startOn" ${r.seats.every(s=>s.ai||s.uid)?'':'disabled'}>Start game</button><span class="note">${r.seats.every(s=>s.ai||s.uid)?'Everyone is seated.':'Waiting for open seats to fill.'}</span>`:`<span class="note">${mineIdx>=0?'Waiting for the host to start.':'Pick an open seat.'}</span>`}</div>`;
 $('#back').onclick=()=>{if(o.unsub){o.unsub();o.unsub=null}onlineMenu()};
 M.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>takeSeat(+b.dataset.seat));
 if(isHost&&$('#startOn'))$('#startOn').onclick=()=>startOnline(r)}
async function takeSeat(i){const o=online,ref=o.db.doc('rooms/'+o.code);try{const l=await ref.acquire({holder:o.me,ttlMs:4000});if(!l.acquired){toast('Someone else is joining. Try again in a moment.');return}
 const s=await ref.get(),r=s.data();if(r.seats[i].uid||r.seats.some(x=>x.uid===o.me))return;const seats=r.seats.map((x,j)=>j===i?{...x,uid:o.me}:x);await ref.update({seats})}catch(e){toast('Could not take the seat ('+(e.code||'error')+').')}}
async function startOnline(r){const o=online;const seats=r.seats.map(s=>({f:s.f,human:!s.ai,uid:s.uid}));newGame({...r.cfg,seats,online:true});S.online=true;
 enterGame();VIEW=S.players.findIndex(p=>p.uid===o.me);focusPlayer(VIEW);busy=true;
 while(!S.over&&!S.players[S.cur].human){await runAI(S.cur);if(S.over)break;advance()}busy=false;await pushOnline('playing');ui()}
async function pushOnline(status){const o=online;if(!o)return;o.rev++;const body={state:serialize(),rev:o.rev,status:S.over?'over':(status||'playing')};
 for(let a=0;a<4;a++){try{await o.db.doc('rooms/'+o.code).update(body);return}catch(e){if(a===3){toast('Could not send your turn ('+(e.code||'error')+'). It will retry when you reopen the room.');return}await new Promise(r=>setTimeout(r,800*(a+1)))}}}

/* boot */
showDemo();menuMain();
</script>
</body>
</html>
